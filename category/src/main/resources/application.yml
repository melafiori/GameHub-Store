spring:
  application:
    name: msvc-category

  datasource:
    url: jdbc:h2:file:./data/categories
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html
  enable-hateoas: false

server:
  port: 8002

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8013/eureka/