spring.application.name=gateway
server.port=8014

eureka.client.service-url.defaultZone=http://localhost:8013/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=auth
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MSVC-AUTH
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

