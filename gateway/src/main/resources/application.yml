server:
  port: 8014

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth
              uri: lb://MSVC-AUTH
              predicates:
                - Path=/api/v1/auth/**

            - id: category
              uri: lb://MSVC-CATEGORY
              predicates:
                - Path=/api/v1/categories/**

            - id: inventory
              uri: lb://MSVC-INVENTORY
              predicates:
                - Path=/api/v1/inventory/**

            - id: product
              uri: lb://MSVC-PRODUCT
              predicates:
                - Path=/api/v1/products/**

            - id: user
              uri: lb://MSVC-USER
              predicates:
                - Path=/api/v1/users/**

            - id: notification
              uri: lb://NOTIFICATION
              predicates:
                - Path=/api/v1/notifications/**

            - id: order
              uri: lb://ORDER
              predicates:
                - Path=/api/v1/orders/**

            - id: payment
              uri: lb://PAYMENT
              predicates:
                - Path=/api/v1/payments/**

            - id: promotion
              uri: lb://PROMOTION
              predicates:
                - Path=/api/v1/promotions/**

            - id: review
              uri: lb://REVIEW
              predicates:
                - Path=/api/v1/reviews/**

            - id: warranty
              uri: lb://WARRANTY
              predicates:
                - Path=/api/v1/warranties/**

            - id: shipping
              uri: lb://SHIPPING
              predicates:
                - Path=/api/v1/shipping/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8013/eureka/